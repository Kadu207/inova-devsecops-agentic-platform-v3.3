services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-18222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inova_platform
      POSTGRES_USER: inova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inova_dev_password_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inova -d inova_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-16333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio:RELEASE.2024-07-26T20-48-21Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inova
      MINIO_ROOT_PASSWORD: inova_minio_dev_change_me
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19011}:9001"
    volumes:
      - minio_data:/data

  worker-base: &worker_base
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: true
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  orchestrator:
    <<: *worker_base
    command: ["python", "-m", "workers.orchestrator.main"]

  audit-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.audit_pipeline.main"]

  opencode-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.opencode_executor.main"]

  sonar-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.sonar_worker.main"]

  snyk-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.snyk_worker.main"]

  datadog-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.datadog_worker.main"]

  test-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.test_worker.main"]

  build-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.build_worker.main"]

  review-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.review_worker.main"]

  release-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.release_worker.main"]

  notification-worker:
    <<: *worker_base
    command: ["python", "-m", "workers.notification_worker.main"]

  publisher:
    <<: *worker_base
    restart: "no"
    profiles: ["tools"]

  webhook-ingress:
    <<: *worker_base
    command: ["python", "-m", "workers.webhook_ingress.main"]
    ports:
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-18787}:8787"
    profiles: ["staging"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-inova_grafana_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inova_dev_password_change_me}
      GF_POSTGRES_SSLMODE: disable
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/inova-audit-overview.json:/var/lib/grafana/dashboards/inova-audit-overview.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  opencode:
    image: node:22-bookworm
    working_dir: /workspace
    command: ["bash", "-lc", "npm install -g opencode-ai || true; tail -f /dev/null"]
    env_file: .env
    volumes:
      - .:/workspace
      - opencode_cache:/root/.cache
    profiles: ["opencode"]

volumes:
  nats_data:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  opencode_cache:
  grafana_data:
