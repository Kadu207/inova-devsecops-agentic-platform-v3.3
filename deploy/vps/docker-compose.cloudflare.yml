# Cloudflare proxy/tunnel — sem Caddy (porta 80/443 ja ocupada na VPS)
# Onda 7: webhook apenas em loopback. Exponha 80/443 via Cloudflare Tunnel / Caddy.

services:
  minio:
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  webhook-ingress:
    ports: !override
      - "127.0.0.1:8787:8787"
