name: workers-runtime
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  workers-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall runtime workers scripts
      - run: pytest -q tests/test_events.py tests/test_contracts.py tests/test_adapters.py tests/test_adapters_integrated.py tests/test_orchestrator.py
