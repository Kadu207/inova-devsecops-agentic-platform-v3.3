name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check runtime workers scripts tests
      - run: ruff format --check runtime workers scripts tests
      - run: python scripts/validate_contracts.py
      - run: pytest -q
