name: compliance
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_contracts.py
      - run: test -f docs/legal/politica-de-privacidade.md
      - run: test -f docs/legal/termos-de-uso.md
      - run: test -f docs/security/pipeline-security.md
